<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #ffe6ec, #ffc2d1);
}

.card {
  background: white;
  padding: 50px 40px;
  border-radius: 22px;
  box-shadow: 0 25px 45px rgba(0,0,0,0.18);
  text-align: center;
  width: 380px;
  max-width: 92%;
  animation: fadeIn 1s ease;
  position: relative;
  z-index: 2;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  color: #b0003a;
  font-size: 2rem;
  margin-bottom: 10px;
}

p {
  color: #555;
  margin-bottom: 35px;
  font-size: 0.95rem;
}

.button-area {
  position: relative;
  height: 150px;
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px 36px;
  font-size: 1rem;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.35s ease;
}

#yesBtn {
  background: linear-gradient(135deg, #ff4d6d, #ff1f4a);
  color: white;
  box-shadow: 0 10px 25px rgba(255, 77, 109, 0.45);
}

#noBtn {
  background: #f2f2f2;
  color: #444;
  position: absolute;
  right: 0;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

#musicBtn {
  position: absolute;
  top: -18px;
  right: -18px;
  background: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  border: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  cursor: pointer;
}

.heart {
  position: absolute;
  bottom: -20px;
  color: rgba(255, 77, 109, 0.6);
  font-size: 18px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) scale(1.6);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <button id="musicBtn" onclick="toggleMusic()">🎵</button>

  <h1>Will you be my Valentine, <span id="name">My Love</span>? 💕</h1>
  <p>I promise laughs, affection, and unforgettable moments.</p>

  <div class="button-area">
    <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button id="noBtn" onclick="sayNo()">No 🙃</button>
  </div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/02/23/audio_14c6ffacb3.mp3" type="audio/mpeg">
</audio>

<script>
/* PERSONALIZE NAME HERE */
document.getElementById("name").textContent = "Majorie";

/* MUSIC */
const music = document.getElementById("music");
let playing = false;

function toggleMusic() {
  if (!playing) {
    music.play();
  } else {
    music.pause();
  }
  playing = !playing;
}

/* BUTTON LOGIC */
let scale = 1;
let move = 0;

function sayNo() {
  scale += 0.18;
  move += 60;

  const yes = document.getElementById("yesBtn");
  const no = document.getElementById("noBtn");

  yes.style.transform = `scale(${scale})`;
  no.style.transform = `translateX(${move}px)`;

  if (navigator.vibrate) {
    navigator.vibrate(80);
  }

  if (move > 300) {
    no.style.opacity = "0";
    no.style.pointerEvents = "none";
  }
}

function sayYes() {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:linear-gradient(135deg,#ff4d6d,#ff1f4a);
      color:white;
      font-family:Poppins;
      text-align:center;
      animation:fadeIn 1s ease;
    ">
      <h1 style="font-size:3rem;">She said YES 💍💖</h1>
      <p style="font-size:1.3rem;">Best Valentine ever 🥰</p>
    </div>
  `;
}

/* FLOATING HEARTS */
setInterval(() => {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 14 + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>

</html>
